# Minimal but production-style Python project. Same shape Real Teams use:
# src layout, pyproject.toml, pytest. No framework yet (Part 5 adds FastAPI).
[project]
name = "payments"
version = "0.1.0"
description = "Payment authorization domain - production-style Python"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths   = ["tests"]
